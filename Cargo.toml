[package]
name = "soulbound"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
# Bevy without the "3d" and "audio" default features: we are a 2D game and use
# bevy_kira_audio instead of bevy_audio (the two must not both be enabled).
bevy = { version = "=0.20.0", default-features = false, features = [
    "2d",
    "ui",
    "png",
    "tonemapping_luts",
] }
bevy_kira_audio = { version = "=0.27.1", features = ["wav", "ogg"] }
rand = "=0.9.2"

# Compile dependencies with optimisations even in debug builds so the game
# hits 60 FPS during development while our own code stays fast to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
